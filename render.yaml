databases:
  - name: bakery-db
    plan: free
    databaseName: bakery
    user: bakery

services:
  - type: web
    name: bakery-app
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: "نظام إدارة المخابز"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_LOCALE
        value: ar
      - key: APP_FALLBACK_LOCALE
        value: en
      - key: APP_KEY
        value: "base64:e5HH3INwVlBYDJK5G18kTygIBR+U9f8k9qfmrgPNJ5U="
      - key: LOG_CHANNEL
        value: stderr
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: DB_CONNECTION
        value: pgsql
      - key: DB_HOST
        fromDatabase:
          name: bakery-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: bakery-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: bakery-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: bakery-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: bakery-db
          property: password
