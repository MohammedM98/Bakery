<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>شاشات تطبيق المخبز</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Readex+Pro:wght@400;500;600&family=Noto+Sans+Arabic:wght@400;500;600&family=Almarai:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --font: "IBM Plex Sans Arabic";
    --page: #f4f6f9; --outer: #e3e8ee; --card: #ffffff; --muted-bg: #eef1f5; --ink: #18202b; --muted: #5f6b7a;
    --border: #e3e8ee; --orange: #ee7a3a; --orange-ink: #c2561b; --orange-soft: #fdeee4; --slate: #6f7f97; --slate-soft: #e9eef5;
    --hero: #1c2532; --hero-muted: #aeb8c6; --success: #1b8a5a; --success-soft: #e2f3ea; --danger: #c8412f; --danger-soft: #fbe8e4;
    --wheat: #a8731a; --wheat-soft: #f8eedb; --bar: #e1e6ed; --warn: #9a6414; --warn-soft: #fbf0dc;
    --glass: rgba(255,255,255,.7); --glass-border: rgba(255,255,255,.85); --scrim: rgba(20,28,40,.38);
    --shadow: 0 1px 2px rgba(20,30,45,.04), 0 10px 28px -16px rgba(20,30,45,.16);
    --focus: 0 0 0 3px color-mix(in oklab, var(--orange) 45%, transparent);
    --on-accent: #1a1d22; --on-danger: #ffffff;
  }
  :root[data-theme="dark"] {
    --page: #0f141b; --outer: #070a0e; --card: #171d26; --muted-bg: #1e2631; --ink: #e8edf3; --muted: #95a0ae;
    --border: #252e3a; --orange: #f08a4e; --orange-ink: #f5a676; --orange-soft: #33241b; --slate: #93a3ba; --slate-soft: #222b37;
    --hero: #1f2935; --hero-muted: #aeb8c6; --success: #4cc58f; --success-soft: #14291f; --danger: #f07a6b; --danger-soft: #361a1a;
    --wheat: #e6bb69; --wheat-soft: #2e2617; --bar: #263040; --warn: #e6b25c; --warn-soft: #2e2617;
    --glass: rgba(30,38,50,.72); --glass-border: rgba(255,255,255,.08); --scrim: rgba(0,0,0,.55);
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 10px 28px -16px rgba(0,0,0,.6);
    --on-danger: #1a1d22;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin: 0; font-family: var(--font), system-ui, sans-serif; color: var(--ink); background: var(--outer); -webkit-font-smoothing: antialiased; line-height: 1.6; }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
  .num { font-variant-numeric: tabular-nums; direction: ltr; unicode-bidi: isolate; }
  svg.i { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; flex: none; }

  /* رأس الصفحة وجدول المحتويات */
  .bar-top { position: sticky; top: 0; z-index: 20; background: color-mix(in oklab, var(--outer) 88%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid var(--border); }
  .bar-in { max-width: 1240px; margin: 0 auto; padding: 12px 16px 10px; }
  .bar-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; }
  .bar-row h1 { font-size: 19px; font-weight: 600; margin: 0; }
  .ctrls { margin-inline-start: auto; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .ctl { display: inline-flex; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 3px; }
  .ctl button, .ctl select { font: inherit; font-size: 13px; border: 0; background: transparent; color: var(--muted); border-radius: 9px; padding: 0 12px; height: 32px; cursor: pointer; }
  .ctl button[aria-pressed="true"] { background: var(--muted-bg); color: var(--ink); font-weight: 600; }
  .ctl select { color: var(--ink); padding-inline-end: 6px; }
  .ctl button:focus-visible, .ctl select:focus-visible, .toc a:focus-visible { outline: none; box-shadow: var(--focus); }
  .toc { display: flex; gap: 6px; overflow-x: auto; margin-top: 10px; padding-bottom: 2px; scrollbar-width: thin; }
  .toc a { flex: none; font-size: 13px; color: var(--muted); text-decoration: none; padding: 4px 11px; border-radius: 99px; background: var(--card); border: 1px solid var(--border); }
  .toc a:hover { color: var(--ink); }

  main { max-width: 1240px; margin: 0 auto; padding: 8px 16px 64px; }
  .lead { color: var(--muted); font-size: 14px; max-width: 72ch; margin: 18px 0 8px; }
  section.s { padding-top: 36px; scroll-margin-top: 110px; }
  section.s > h2 { font-size: 22px; font-weight: 600; margin: 0 0 4px; }
  section.s > p { margin: 0 0 18px; color: var(--muted); font-size: 14px; max-width: 72ch; }
  .pair { display: flex; flex-wrap: wrap; gap: 28px 32px; }
  figure { margin: 0; width: 340px; max-width: 100%; }
  figcaption { margin-top: 10px; font-size: 14px; }
  figcaption b { font-weight: 600; }
  figcaption span { color: var(--muted); }

  /* الهاتف */
  .phone { width: 340px; max-width: 100%; height: 700px; border-radius: 42px; background: var(--page); border: 8px solid #0d1117; position: relative; overflow: hidden; box-shadow: 0 30px 60px -36px rgba(20,30,45,.5); font-size: 15px; }
  .screen { position: absolute; inset: 0; overflow-y: auto; padding: 52px 16px 116px; scrollbar-width: none; }
  .screen::-webkit-scrollbar { display: none; }
  .screen.nonav { padding-bottom: 28px; }
  .status { position: absolute; top: 0; inset-inline: 0; height: 42px; display: flex; align-items: center; justify-content: space-between; padding: 0 22px; font-size: 13px; font-weight: 600; z-index: 3; background: color-mix(in oklab, var(--page) 86%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
  .status.on-dark { background: transparent; color: #fff; backdrop-filter: none; }
  .net { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 500; color: var(--muted); background: var(--card); border: 1px solid var(--border); padding: 2px 10px; border-radius: 99px; }
  .net i { width: 7px; height: 7px; border-radius: 50%; background: var(--success); }
  .net.off { color: var(--warn); background: var(--warn-soft); border-color: transparent; }
  .net.off i { background: var(--warn); }

  /* عناصر عامة */
  .head { display: flex; align-items: center; gap: 8px; margin: 8px 0 16px; min-height: 40px; }
  .head h3 { margin: 0; font-size: 24px; font-weight: 600; line-height: 1.35; }
  .head h3.sm { font-size: 20px; }
  .head small { display: block; color: var(--muted); font-size: 13px; font-weight: 400; }
  .iconbtn { width: 40px; height: 40px; border-radius: 13px; display: grid; place-items: center; color: var(--ink); background: var(--card); border: 1px solid var(--border); flex: none; }
  .iconbtn.plain { background: transparent; border: 0; }
  .end { margin-inline-start: auto; }
  .chip { display: inline-flex; align-items: center; gap: 4px; font-size: 13px; border: 1px solid var(--border); background: var(--card); border-radius: 12px; padding: 5px 10px; color: var(--ink); white-space: nowrap; }
  .chip svg.i { width: 15px; height: 15px; color: var(--muted); }
  .chip.on { background: var(--ink); color: var(--page); border-color: transparent; }
  .chips { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
  .seg { display: flex; gap: 4px; margin-bottom: 14px; }
  .seg span { font-size: 13px; padding: 7px 13px; border-radius: 11px; color: var(--muted); }
  .seg span.on { background: var(--muted-bg); color: var(--ink); font-weight: 500; }
  .pills { display: flex; background: var(--muted-bg); padding: 4px; border-radius: 99px; margin-bottom: 14px; }
  .pills span { flex: 1; text-align: center; font-size: 14px; color: var(--muted); padding: 7px 0 4px; border-radius: 99px; }
  .pills span.on { background: var(--card); color: var(--ink); font-weight: 600; box-shadow: 0 1px 3px rgba(20,30,45,.12); }
  .pills span.on::after { content: ""; display: block; width: 14px; height: 2px; border-radius: 2px; background: var(--orange); margin: 2px auto 0; }
  .tabs2 { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; background: var(--muted-bg); border-radius: 14px; padding: 4px; margin-bottom: 14px; }
  .tabs2.three { grid-template-columns: 1fr 1fr 1fr; }
  .tabs2 span { text-align: center; padding: 8px 0; border-radius: 11px; font-size: 14px; color: var(--muted); }
  .tabs2 span.on { background: var(--card); color: var(--ink); font-weight: 600; box-shadow: 0 1px 3px rgba(20,30,45,.12); }

  .card { background: var(--card); border: 1px solid var(--border); border-radius: 22px; padding: 16px; box-shadow: var(--shadow); margin-bottom: 12px; }
  .card.flat { box-shadow: none; }
  .hero { background: var(--hero); border: 0; color: #fff; }
  .hero .l { color: var(--hero-muted); font-size: 14px; }
  .hero .big { font-size: 42px; font-weight: 600; line-height: 1.15; margin: 4px 0; }
  .hero .big small { font-size: 18px; font-weight: 500; color: #c9d2de; margin-inline-start: 4px; }
  .hero .split { display: flex; gap: 16px; color: var(--hero-muted); font-size: 13px; flex-wrap: wrap; }
  .hero .split b { color: #fff; font-weight: 600; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
  .grid2 .card { margin: 0; }
  .stat .l { color: var(--muted); font-size: 13px; }
  .stat .v { font-size: 18px; font-weight: 600; margin-top: 4px; white-space: nowrap; }
  .stat .x { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .unit { font-size: 13px; font-weight: 500; color: var(--muted); }

  .big-num { font-size: 40px; font-weight: 600; line-height: 1.1; }
  .big-num small { font-size: 17px; color: var(--muted); font-weight: 500; margin-inline-start: 4px; }
  .label { color: var(--muted); font-size: 14px; }
  .t-section { display: flex; align-items: center; font-size: 16px; font-weight: 600; margin: 6px 0 4px; }
  .t-section a { margin-inline-start: auto; font-size: 13px; font-weight: 500; color: var(--muted); text-decoration: none; }
  .date-h { font-size: 13px; color: var(--muted); margin: 12px 0 2px; }

  .chart { width: 100%; height: 150px; display: block; margin: 6px 0 14px; overflow: visible; }
  .chart text { fill: var(--muted); font-size: 11px; font-family: var(--font), sans-serif; }

  /* الصفوف */
  .rows { list-style: none; margin: 0; padding: 0; }
  .rows li { display: flex; align-items: center; gap: 12px; padding: 8px 0; min-height: 60px; }
  .rows.lined li + li { border-top: 1px solid var(--border); }
  .ic { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; flex: none; }
  .ic svg.i { width: 18px; height: 18px; }
  .ic.sale { background: var(--slate-soft); color: var(--slate); }
  .ic.pay { background: var(--success-soft); color: var(--success); }
  .ic.flour { background: var(--wheat-soft); color: var(--wheat); }
  .ic.adj { background: var(--orange-soft); color: var(--orange-ink); }
  .ic.bank { background: var(--muted-bg); color: var(--ink); }
  .ic.bad { background: var(--danger-soft); color: var(--danger); }
  .ic.sq { border-radius: 14px; }
  .av { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; flex: none; background: var(--slate-soft); color: var(--ink); font-weight: 600; font-size: 15px; }
  .who { flex: 1; min-width: 0; }
  .who b { display: block; font-size: 15px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sheet-t .who b { white-space: normal; }
  .who span { color: var(--muted); font-size: 13px; }
  .amt { font-size: 15px; font-weight: 500; white-space: nowrap; text-align: end; }
  .amt small { display: block; font-size: 13px; font-weight: 400; color: var(--muted); }
  .in { color: var(--success); }
  .debt { color: var(--danger); }
  .pend { color: var(--warn) !important; }
  .chev { color: var(--muted); }
  .view-all { display: block; width: max-content; margin: 10px auto 0; font-size: 13px; padding: 9px 18px; border-radius: 99px; background: var(--muted-bg); color: var(--ink); }

  .badge { display: inline-block; font-size: 13px; padding: 2px 8px; border-radius: 99px; font-weight: 500; white-space: nowrap; }
  .badge.wait { background: var(--warn-soft); color: var(--warn); }
  .badge.ok { background: var(--success-soft); color: var(--success); }
  .badge.no { background: var(--danger-soft); color: var(--danger); }
  .badge.mute { background: var(--muted-bg); color: var(--muted); }

  /* النماذج */
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  .input { height: 48px; border-radius: 14px; border: 1px solid var(--border); background: var(--card); display: flex; align-items: center; gap: 8px; padding: 0 16px; font-size: 15px; color: var(--ink); }
  .input.focus { border-color: var(--orange); box-shadow: var(--focus); }
  .input .ph { color: var(--muted); }
  .input .suf { margin-inline-start: auto; color: var(--muted); font-size: 13px; }
  .input.err { border-color: var(--danger); }
  .hint { font-size: 13px; color: var(--muted); margin-top: 4px; }
  .hint.err { color: var(--danger); }
  .pairf { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 6px; }
  .pairf .input { padding: 0 10px; font-size: 14px; }
  .pairf .arrow { color: var(--muted); }
  .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
  .opt { border: 1px solid var(--border); background: var(--card); border-radius: 16px; padding: 12px; display: flex; flex-direction: column; gap: 8px; min-height: 76px; font-size: 14px; }
  .opt.on { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
  .opt svg.i { color: var(--muted); }
  .opt.on svg.i { color: var(--ink); }
  .note { font-size: 13px; background: var(--muted-bg); border-radius: 12px; padding: 12px; color: var(--muted); margin-bottom: 12px; }
  .note b { color: var(--ink); font-weight: 600; }
  .note.warn { background: var(--warn-soft); color: var(--warn); }
  .checks { list-style: none; margin: 0; padding: 0; }
  .checks li { display: flex; align-items: center; gap: 10px; min-height: 44px; font-size: 14px; }
  .box { width: 22px; height: 22px; border-radius: 6px; border: 1.5px solid var(--slate); display: grid; place-items: center; flex: none; background: var(--card); }
  .box.on { background: var(--ink); border-color: var(--ink); color: var(--page); }
  .box svg.i { width: 14px; height: 14px; stroke-width: 2.6; }
  .switch { width: 44px; height: 26px; border-radius: 99px; background: var(--bar); position: relative; flex: none; margin-inline-start: auto; }
  .switch::after { content: ""; position: absolute; top: 3px; inset-inline-start: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
  .switch.on { background: var(--ink); }
  .switch.on::after { inset-inline-start: auto; inset-inline-end: 3px; }
  :root[data-theme="dark"] .switch.on::after { background: var(--page); }
  .grp-h { font-size: 13px; color: var(--muted); margin: 14px 0 2px; display: flex; }
  .grp-h span { margin-inline-start: auto; }

  .btns { display: flex; gap: 12px; margin-top: 16px; }
  .btns.col { flex-direction: column; }
  .btn { flex: 1; min-height: 50px; border-radius: 16px; border: 0; font-size: 15px; font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 0 16px; }
  .btn.sec { background: var(--muted-bg); color: var(--ink); }
  .btn.pri { background: var(--orange); color: var(--on-accent); font-weight: 600; }
  .btn.dark { background: var(--ink); color: var(--page); font-weight: 600; }
  .btn.danger { background: var(--danger); color: var(--on-danger); font-weight: 600; }
  .btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--border); }
  .btn.off { opacity: .45; }
  .btn svg.i { width: 19px; height: 19px; }

  /* قوائم الإعدادات */
  .menu { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 0 16px; margin-bottom: 12px; }
  .menu li { display: flex; align-items: center; gap: 12px; min-height: 54px; font-size: 15px; }
  .menu li + li { border-top: 1px solid var(--border); }
  .menu li .v { margin-inline-start: auto; color: var(--muted); font-size: 14px; }
  .menu li .ic { width: 34px; height: 34px; border-radius: 11px; }
  .menu li.dim { color: var(--muted); }
  .menu-t { font-size: 13px; color: var(--muted); margin: 14px 4px 6px; }
  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .tile { background: var(--card); border: 1px solid var(--border); border-radius: 18px; padding: 16px; min-height: 96px; display: flex; flex-direction: column; justify-content: space-between; font-size: 14px; font-weight: 500; }
  .tile small { color: var(--muted); font-weight: 400; font-size: 13px; }
  .tile.dim { opacity: .55; }

  /* النافذة السفلية والحوار */
  .scrim { position: absolute; inset: 0; background: var(--scrim); z-index: 5; }
  .sheet { position: absolute; inset-inline: 0; bottom: 0; z-index: 6; background: var(--card); border-radius: 28px 28px 0 0; padding: 12px 16px 24px; box-shadow: 0 -20px 40px -20px rgba(0,0,0,.35); max-height: 86%; overflow-y: auto; scrollbar-width: none; }
  .sheet.tall { max-height: 92%; }
  .grab { width: 40px; height: 5px; border-radius: 99px; background: var(--bar); margin: 0 auto 14px; }
  .sheet-t { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
  .sheet-t b { font-size: 18px; font-weight: 600; }
  .group { background: var(--muted-bg); border-radius: 16px; padding: 0 16px; margin: 0 0 8px; }
  .group div { display: flex; justify-content: space-between; gap: 12px; padding: 10px 0; font-size: 14px; }
  .group div + div { border-top: 1px solid var(--border); }
  .group dt { color: var(--muted); margin: 0; }
  .group dd { margin: 0; font-weight: 500; text-align: end; }
  .dialog { position: absolute; z-index: 6; inset-inline: 22px; top: 50%; transform: translateY(-50%); background: var(--card); border-radius: 24px; padding: 24px 20px 20px; text-align: center; box-shadow: 0 30px 60px -20px rgba(0,0,0,.45); }
  .dialog .ic { margin: 0 auto 10px; width: 52px; height: 52px; }
  .dialog b { display: block; font-size: 18px; font-weight: 600; margin-bottom: 6px; }
  .dialog p { margin: 0; color: var(--muted); font-size: 14px; }
  .receipt { text-align: center; padding: 4px 0 10px; border-bottom: 1.5px dashed var(--border); margin-bottom: 12px; }
  .receipt .big-num { margin: 8px 0 6px; }
  .kv { list-style: none; margin: 0 0 8px; padding: 0; }
  .kv li { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; font-size: 14px; }
  .kv li span:first-child { color: var(--muted); }

  /* لوحة الأرقام */
  .amount-show { text-align: center; margin: 2px 0; }
  .amount-show b { font-size: 50px; font-weight: 600; }
  .amount-show small { font-size: 20px; color: var(--muted); margin-inline-start: 6px; }
  .calc { text-align: center; color: var(--muted); font-size: 14px; margin-bottom: 14px; }
  .calc b { color: var(--ink); font-weight: 600; }
  .keys { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; direction: ltr; }
  .keys span { height: 50px; border-radius: 14px; display: grid; place-items: center; font-size: 21px; font-weight: 500; background: var(--muted-bg); }
  .presets { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 12px; }
  .presets span { height: 48px; border-radius: 14px; border: 1px solid var(--border); background: var(--card); display: grid; place-items: center; font-size: 15px; font-weight: 500; }
  .presets span.on { border-color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
  .stepper { display: flex; align-items: center; gap: 12px; justify-content: center; margin: 8px 0 14px; }
  .stepper .iconbtn { width: 52px; height: 52px; border-radius: 16px; }

  /* الرسائل العائمة */
  .toast { position: absolute; inset-inline: 16px; z-index: 7; display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: 18px;
    background: var(--glass); border: 1px solid var(--glass-border); backdrop-filter: blur(18px) saturate(160%); -webkit-backdrop-filter: blur(18px) saturate(160%); box-shadow: 0 18px 40px -18px rgba(20,30,45,.5); }
  .toast.top { top: 50px; }
  .toast.top2 { top: 118px; }
  .toast.bottom { bottom: 96px; }
  .toast.bottom2 { bottom: 164px; }
  .toast .ic { width: 34px; height: 34px; }
  .toast b { display: block; font-size: 14px; font-weight: 600; }
  .toast .s { font-size: 13px; color: var(--muted); }
  .toast .act { margin-inline-start: auto; font-size: 13px; font-weight: 600; color: var(--ink); padding: 6px 4px; }

  /* حالات */
  .empty { text-align: center; padding: 40px 10px 10px; }
  .empty .ic { width: 64px; height: 64px; margin: 0 auto 14px; }
  .empty .ic svg.i { width: 28px; height: 28px; }
  .empty b { display: block; font-size: 18px; font-weight: 600; margin-bottom: 6px; }
  .empty p { margin: 0 auto; color: var(--muted); font-size: 14px; max-width: 30ch; }

function chartLine(vals, labels, ticks, opts = {}) {
  const W = 300, H = 150, top = 12, bottom = 22, left = opts.left ?? 30, max = opts.max ?? Math.max(...vals) * 1.15;
  const X = vals.map((_, i) => W - 6 - i * ((W - left - 6) / (vals.length - 1)));
  const Y = vals.map(v => top + (1 - v / max) * (H - top - bottom));
  let p = `M${X[0]},${Y[0]}`;
  for (let i = 0; i < X.length - 1; i++) { const c = (X[i] + X[i + 1]) / 2; p += opts.smooth === false ? ` L${X[i + 1]},${Y[i + 1]}` : ` C${c},${Y[i]} ${c},${Y[i + 1]} ${X[i + 1]},${Y[i + 1]}`; }
  const L = X.length - 1;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${opts.label || 'رسم'}">` +
    ticks.map(v => { const y = top + (1 - v / max) * (H - top - bottom); return `<line x1="${left}" x2="${W}" y1="${y}" y2="${y}" stroke="var(--border)"/><text x="${left - 6}" y="${y + 3}" text-anchor="end">${v}</text>`; }).join('') +
    (opts.fill ? `<path d="${p} L${X[L]},${H - bottom} L${X[0]},${H - bottom} Z" fill="var(--orange)" opacity=".08"/>` : '') +
    `<path d="${p}" fill="none" stroke="var(--orange)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>` +
    `<circle cx="${X[L]}" cy="${Y[L]}" r="4.5" fill="var(--card)" stroke="var(--orange)" stroke-width="2.2"/>` +
    labels.map((l, i) => `<text x="${X[i]}" y="${H - 5}" text-anchor="middle">${l}</text>`).join('') + `</svg>`;
}
function chartBars(vals, labels, label) {
  const W = 300, H = 140, top = 24, bottom = 22, max = Math.max(...vals) * 1.1, bw = 22;
  const X = vals.map((_, i) => W - 22 - i * ((W - 44) / (vals.length - 1)));
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${label}">` + vals.map((v, i) => {
    const h = v / max * (H - top - bottom), y = H - bottom - h, hot = i === vals.length - 1;
    return `<rect x="${X[i] - bw / 2}" y="${y}" width="${bw}" height="${h}" rx="7" fill="${hot ? 'var(--orange)' : 'var(--bar)'}"/>` + (hot ? `<text x="${X[i]}" y="${y - 7}" text-anchor="middle" style="fill:var(--ink);font-weight:600;font-size:11px">${v}</text>` : '');
  }).join('') + labels.map((l, i) => `<text x="${X[i]}" y="${H - 5}" text-anchor="middle">${l}</text>`).join('') + `</svg>`;
}

/* العرض */
document.getElementById('sections').innerHTML = S.map(s => `
  <section class="s" id="${s.id}"><h2>${s.title}</h2><p>${s.note}</p>
    <div class="pair">
      <figure>${s.a.html}<figcaption><b>الخيار أ:</b> <span>${s.a.cap}</span></figcaption></figure>
      <figure>${s.b.html}<figcaption><b>الخيار ب:</b> <span>${s.b.cap}</span></figcaption></figure>
    </div></section>`).join('');
document.getElementById('toc').innerHTML = S.map(s => `<a href="#${s.id}">${s.title}</a>`).join('');

/* أدوات التحكم */
const press = (sel, el) => document.querySelectorAll(sel).forEach(b => b.setAttribute('aria-pressed', b === el));
document.querySelectorAll('[data-nav-btn]').forEach(b => b.addEventListener('click', () => { document.body.dataset.nav = b.dataset.navBtn; press('[data-nav-btn]', b); }));
document.querySelectorAll('[data-theme-btn]').forEach(b => b.addEventListener('click', () => { document.documentElement.dataset.theme = b.dataset.themeBtn; press('[data-theme-btn]', b); }));
document.getElementById('font').addEventListener('change', e => document.documentElement.style.setProperty('--font', `"${e.target.value}"`));
const q = new URLSearchParams(location.search);
if (q.get('theme') === 'dark') document.querySelector('[data-theme-btn="dark"]').click();
if (q.get('nav') === 'a') document.querySelector('[data-nav-btn="a"]').click();
if (q.get('font')) { const f = document.getElementById('font'); f.value = q.get('font'); f.dispatchEvent(new Event('change')); }
</script>
